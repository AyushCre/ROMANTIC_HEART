<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ishq Ban Baitha - Dual Aesthetic Heart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #ui-container {
            position: absolute;
            z-index: 10;
            text-align: center;
        }

        button {
            background: linear-gradient(135deg, #ff0055, #ff3366, #ff758c);
            color: #ffffff;
            border: none;
            padding: 16px 36px;
            font-size: 20px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0px 0px 30px rgba(255, 0, 85, 0.7);
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: scale(1.06);
            box-shadow: 0px 0px 45px rgba(255, 0, 85, 1);
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <button id="startBtn">Experience The Love ✨</button>
        <audio id="bgMusic" src="ISHQ BAN BAITHA.mp3"></audio>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        const btn = document.getElementById('startBtn');
        const audio = document.getElementById('bgMusic');
        const uiContainer = document.getElementById('ui-container');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Heart Formula (True Mathematical Curve)
        function getHeartCoordinate(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        const DURATION = 25000; // 30 seconds
        const TOTAL_RAYS = 2400; // Dense fibers for rich texture
        let startTime = null;
        let raysDrawn = 0;

        // Permanent buffer for the drawn fibers & border dust
        const staticCanvas = document.createElement('canvas');
        staticCanvas.width = width;
        staticCanvas.height = height;
        const sCtx = staticCanvas.getContext('2d');
        sCtx.globalCompositeOperation = 'lighter';

        // Floating ambient sparkle particles array
        const floatingParticles = [];

        function addDustCloud(targetX, targetY, scale) {
            // Video 1 Sparkle Cloud Generator (12-18 particles per node)
            const count = Math.floor(Math.random() * 6) + 12;
            for (let k = 0; k < count; k++) {
                const spread = (Math.random() - 0.5) * (scale * 2.8);
                const spreadY = (Math.random() - 0.5) * (scale * 2.8);
                const px = targetX + spread;
                const py = targetY + spreadY;
                const radius = Math.random() * 1.6 + 0.3;
                const alpha = Math.random() * 0.7 + 0.3;
                
                // Color spectrum: Deep Pink to Soft Peach White
                const isWhiteSparkle = Math.random() > 0.75;
                const color = isWhiteSparkle 
                    ? `rgba(255, 240, 245, ${alpha})`
                    : `rgba(${255}, ${Math.floor(Math.random()*80 + 30)}, ${Math.floor(Math.random()*150 + 100)}, ${alpha * 0.8})`;

                sCtx.beginPath();
                sCtx.arc(px, py, radius, 0, Math.PI * 2);
                sCtx.fillStyle = color;
                sCtx.shadowBlur = Math.random() * 10 + 4;
                sCtx.shadowColor = '#ff2a7a';
                sCtx.fill();

                // Live dynamic floating sparkles
                if (Math.random() > 0.85 && floatingParticles.length < 350) {
                    floatingParticles.push({
                        x: px,
                        y: py,
                        vx: (Math.random() - 0.5) * 0.4,
                        vy: (Math.random() - 0.5) * 0.4,
                        alpha: alpha,
                        maxAlpha: alpha,
                        size: radius,
                        twinkleSpeed: Math.random() * 0.05 + 0.02
                    });
                }
            }
        }

        function render(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsed = timestamp - startTime;
            const progress = Math.min(elapsed / DURATION, 1);

            const targetRayIndex = Math.floor(progress * TOTAL_RAYS);

            const scale = Math.min(width, height) / 38;
            const centerX = width / 2;
            const centerY = height / 2 - (scale * 2);

            // Progressive Drawing Step
            while (raysDrawn < targetRayIndex) {
                const t = (raysDrawn / TOTAL_RAYS) * Math.PI * 2;
                const pt = getHeartCoordinate(t);

                const finalX = centerX + pt.x * scale;
                const finalY = centerY + pt.y * scale;

                // --- 1. RAY BURST FIBERS (Video 2 Style) ---
                sCtx.beginPath();
                sCtx.moveTo(centerX, centerY);
                sCtx.lineTo(finalX, finalY);

                // Gradient along each fiber from glowing core to deep pink
                const grad = sCtx.createLinearGradient(centerX, centerY, finalX, finalY);
                grad.addColorStop(0, 'rgba(255, 120, 180, 0.45)');
                grad.addColorStop(0.4, 'rgba(255, 20, 100, 0.18)');
                grad.addColorStop(1, 'rgba(230, 0, 80, 0.05)');

                sCtx.strokeStyle = grad;
                sCtx.lineWidth = 0.8;
                sCtx.shadowBlur = 0;
                sCtx.stroke();

                // --- 2. BORDER SPARKLE DUST CLOUD (Video 1 Style) ---
                addDustCloud(finalX, finalY, scale);

                raysDrawn++;
            }

            // Draw to Main Display
            ctx.clearRect(0, 0, width, height);

            // Romantic Center Glow Burst
            const centerGlow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, scale * 14);
            centerGlow.addColorStop(0, 'rgba(255, 20, 100, 0.22)');
            centerGlow.addColorStop(0.5, 'rgba(120, 0, 50, 0.08)');
            centerGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = centerGlow;
            ctx.fillRect(0, 0, width, height);

            // Draw Accumulated Heart Texture
            ctx.drawImage(staticCanvas, 0, 0);

            // Render and Animate Floating Twinkling Dust
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < floatingParticles.length; i++) {
                const p = floatingParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha += Math.sin(timestamp * p.twinkleSpeed) * 0.02;
                const currentAlpha = Math.max(0.1, Math.min(p.alpha, p.maxAlpha));

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 220, 240, ${currentAlpha})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#ff4d94';
                ctx.fill();
            }
            ctx.restore();

            if (progress < 1 || floatingParticles.length > 0) {
                requestAnimationFrame(render);
            }
        }

        btn.addEventListener('click', () => {
            uiContainer.style.display = 'none';
            audio.play().catch(e => console.log('Audio playback error:', e));
            requestAnimationFrame(render);
        });
    </script>
</body>
</html>
